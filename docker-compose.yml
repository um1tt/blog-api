version: "3.9"

services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    ports:
      - "8000:8000"
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - .:/app
      - sqlite_data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A settings worker -l info
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - .:/app
      - sqlite_data:/app/data

  celery_beat:
    build: .
    command: celery -A settings beat -l info
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - .:/app
      - sqlite_data:/app/data

  flower:
    build: .
    command: sh -c "celery -A settings flower --port=5555 --basic-auth=$BLOG_FLOWER_USER:$BLOG_FLOWER_PASSWORD"
    ports:
      - "5555:5555"
    env_file:
      - settings/.env
    depends_on:
      - redis
    volumes:
      - .:/app
      - sqlite_data:/app/data

volumes:
  sqlite_data: